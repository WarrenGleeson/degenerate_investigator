name: UFC Ingest Event (Manual)

on:
  workflow_dispatch:
    inputs:
      event_url:
        description: "UFC Stats event URL"
        required: false
        default: "http://ufcstats.com/event-details/f3eb664db7fb1df3"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: "degenerative-investigator"
      EVENT_URL: ${{ inputs.event_url || 'http://ufcstats.com/event-details/f3eb664db7fb1df3' }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull event card
        run: |
          python extract/ufc_event_card.py
