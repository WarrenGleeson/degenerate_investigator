name: UFC Pull Fighter Profiles (Manual)

on:
  workflow_dispatch:
    inputs:
      event_card_key:
        description: "S3 key for the target event card CSV"
        required: true

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: "degenerative-investigator"
      EVENT_CARD_KEY: ${{ inputs.event_card_key }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull fighter profiles
        run: |
          python extract/ufc_fighter_profiles.py
