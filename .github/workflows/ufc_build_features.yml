name: UFC Build Features (Manual)

on:
  workflow_dispatch:
    inputs:
      event_card_key:
        description: "S3 key for the target event card CSV"
        required: false
        default: "raw/ufc/events/ufc-327-prochazka-vs-ulberg_card.csv"

permissions:
  contents: read

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: "degenerative-investigator"
      EVENT_CARD_KEY: ${{ inputs.event_card_key || 'raw/ufc/events/ufc-327-prochazka-vs-ulberg_card.csv' }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build features
        run: |
          python process/ufc_feature_builder.py
