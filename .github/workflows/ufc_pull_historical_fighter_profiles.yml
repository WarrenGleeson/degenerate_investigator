name: UFC Pull Historical Fighter Profiles (Manual)

on:
  workflow_dispatch:
    inputs:
      historical_fights_key:
        description: "S3 key for historical fights CSV"
        required: false
        default: "raw/ufc/fights/historical_fights.csv"
      test_rows:
        description: "Limit unique fighter URLs for testing"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: "degenerative-investigator"
      HISTORICAL_FIGHTS_KEY: ${{ inputs.historical_fights_key || 'raw/ufc/fights/historical_fights.csv' }}
      TEST_ROWS: ${{ inputs.test_rows || '0' }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull historical fighter profiles
        run: |
          python extract/ufc_historical_fighter_profiles.py
