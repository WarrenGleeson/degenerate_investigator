name: UFC Pull Fighter News (Manual)

on:
  workflow_dispatch:
    inputs:
      fighter_profiles_key:
        description: "S3 key for fighter profiles CSV"
        required: false
        default: "raw/ufc/fighters/fighter_profiles.csv"
      test_rows:
        description: "Process only first N fighters (0 = all)"
        required: false
        default: "6"

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: "degenerative-investigator"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIGHTER_PROFILES_KEY: ${{ inputs.fighter_profiles_key }}
      TEST_ROWS: ${{ inputs.test_rows }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull recent fighter news
        run: |
          python extract/fighter_recent_news.py
