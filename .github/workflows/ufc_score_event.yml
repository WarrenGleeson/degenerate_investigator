name: UFC Score Event (Manual)

on:
  workflow_dispatch:
    inputs:
      features_key:
        description: "S3 key for event features CSV"
        required: false
        default: "processed/ufc/ufc-327-prochazka-vs-ulberg_fight_features.csv"

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: "degenerative-investigator"
      FEATURES_KEY: ${{ inputs.features_key || 'processed/ufc/ufc-327-prochazka-vs-ulberg_fight_features.csv' }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Score target event
        run: |
          python process/score_target_event.py
