name: Export Latest Report To Repo (Manual)

on:
  workflow_dispatch:
    inputs:
      report_key:
        description: "S3 key for markdown report"
        required: false
        default: "processed/reports/ufc-327-prochazka-vs-ulberg_fight_report.md"
      output_path:
        description: "Repo path to save report"
        required: false
        default: "reports/latest_fight_report.md"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: "degenerative-investigator"
      REPORT_KEY: ${{ inputs.report_key || 'processed/reports/ufc-327-prochazka-vs-ulberg_fight_report.md' }}
      OUTPUT_PATH: ${{ inputs.output_path || 'reports/latest_fight_report.md' }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export report from S3
        run: |
          python process/export_s3_report_to_repo.py

      - name: Commit exported report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          git diff --cached --quiet || git commit -m "Export latest report to repo"
          git push
